<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link
        href="https://googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <!-- Navbar  -->

    <!-- Load an icon library to show a hamburger menu (bars) on small screens -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <div class="topnav" id="myTopnav">
        <div class="img-div">
            <img src="images/logo.jpeg" alt="SMIT logo">
        </div>
        <div class="navbar">
            <a href="#home" class="active">Home</a>
            <a href="#news">About</a>
            <a href="#contact">Courses</a>
            <a href="#about">Check result</a>
            <a href="#about">Campuses</a>
            <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            </a>
            <!-- <i class="fa fa-bars" style="color: white;"></i> -->
            <button id="btn1">
                Enroll Now
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </button>
        </div>

    </div>
    <!-- Navbar  -->

    <!-- Hero section  -->
    <div class="hero-section-bg">
        <p class="enroll"> <i class="fa-solid fa-graduation-cap" style="color: white;">
            </i>❯ Enroll Now</p>
        <h1 class="regitration-heading">Registration Form</h1>
        <p class="para2">Start your journey towards excellence. Fill out the form to apply for our courses</p>
    </div>
    <!-- Hero section  -->
    <!-- Section 2  -->
    <div class="buttons-div">
        <button id="registration-form">
            <i class="fa-solid fa-clipboard-list" id="icon"></i>
            Registration Form
        </button>
        <button id="id-card">
            <i class="fa-solid fa-address-card"></i>
            DownLoad ID card
        </button>
        <button id="entry-test-status">
            <i class="fa-solid fa-clipboard-check"></i>
            Entry Test Status
        </button>
        <button id="result">
            <i class="fa-solid fa-file-lines"></i>
            Result
        </button>
    </div>

    <!-- Section 2  -->
    <!-- Section 3  -->
    <h2 class="course-details"><i class="fa-solid fa-location-dot"></i>
        Location & Course Details</h2>
    <div class=" main-form-div">
        <div class="form-div-1">
            <label value="">Select Country<span>*</span></label> <br>

            <select id="course" name="course">
                <option value="Austaralia">Australia</option>
                <option value="England">England</option>
                <option value="Pakistan">Pakistan</option>
            </select> <br>
            <label for="gender">Select Gender <span>*</span></label> <br>
            <input type="text" placeholder="Select Gender" disabled> <br>
            <label for="Course">Select Course <span>*</span></label> <br>
            <input type="text" placeholder="No Course available" disabled> <br>
        </div>
        <div class="form-div-2">
            <label for="Class"> Select Class Preference
                <span>*</span>
            </label> <br>
            <input type="text" placeholder="Select Class Preference" disabled> <br>
            <label for="city" id="city"> Select City <span>*</span></label>
            <input type="text" placeholder="Select City"> <br>
            <label for="campus" id="campus"> Select Campus <span>*</span></label>
            <input type="text" placeholder="Select Campus" disabled>
        </div>

    </div>
    <!-- Section 3  -->
    <!-- Section 4  -->
    <h2 class="course-details"><i class="fa-regular fa-user"></i>
        Personal Information</h2>

    <div class=" main-form-div">
        <div class="form-div-1">
            <label value="">Full Name<span>*</span></label> <br>

            <input type="text" placeholder="Enter Your Full Name"> <br>
            <label for="gender">Date Of Birth <span>*</span></label> <br>
            <input type="date">
            <br>
            <label for="Course"> Phone<span>*</span></label> <br>
            <input type="text" placeholder="Enter Phone Number"> <br>
            <label for="Course">ID Number<span>*</span></label> <br>
            <input type="text" placeholder="Enter ID Number"> <br>
        </div>
        <div class="form-div-2">
            <label for="Class"> Father Name
                <span>*</span>
            </label> <br>
            <input type="text" placeholder="Enter Father Name"> <br>
            <label for="city" id="city"> Email <span>*</span></label>
            <input type="email" placeholder="Enter Your Email"> <br>
            <label for="campus" id="campus"> Father's Phone <span>*</span></label>
            <input type="number" placeholder="Enter Phone Number"> <br>
            <label for="campus" id="campus"> Father's ID <span>*</span></label>
            <input type="number" placeholder="Enter ID Number">
        </div>

    </div>
    <label for="" id="label"> Address <span>*</span></label>
    <span id="span"> 0/220 characters</span><br> <br>
    <input type=" text" placeholder="Enter your complete address(minimum 10 characters )" id="address">

    <!-- Section 4 -->
    <!-- SEction 5  -->
    <div class="main-form-div">
        <div class="form-div-1">
            <label value="">Last Qualification<span>*</span></label> <br>

            <select name="" id="">Last Qualification
                <option value="Matric">Matriculation</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Undergraduate">Undergraduate</option>
                <option value="Bachelor's Degree">Bachelor's Degree</option>
                <option value="Master's Degree">Master's Degree</option>
                <option value="other"> Other</option>
                <1></1>
            </select>

            <br>
        </div>
        <div class="form-div-2">
            <label for="gender" id="cs">Computer Profficiency<span>*</span></label> <br>
            <select name="" id="select">Select Your Computer Proffeciency
                <option value="bigginer">Beginner</option>
                <option value="advanced">Advance</option>
                <option value="intermediate">Intermediate</option>
                <option value="Expert">Expert</option>
            </select>
        </div>
        <label for="" id="label"> Where did you hear about us? <span>*</span></label>
        <span id="span"> 0/220 characters</span><br> <br>
        <input type=" text" placeholder="Enter your complete address(minimum 10 
characters )" id="address"> <br>
        <label for="" id="laptop">Do you have a Laptop?<span>*</span></label>

   <input type="radio" name="laptop" value="Yes" id="Yes">Yes
   <input type="radio" name="laptop" value="No" id="No"> No
        <!-- Section 5  -->

        <script src="script.js"></script>
</body>

</html>
